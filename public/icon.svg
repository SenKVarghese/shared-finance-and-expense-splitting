<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="circleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="circleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle glow ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Left Intersecting Circle (Husband / Blue) -->
  <circle cx="205" cy="256" r="95" fill="url(#circleGrad1)" fill-opacity="0.85"/>

  <!-- Right Intersecting Circle (Wife / Emerald) -->
  <circle cx="307" cy="256" r="95" fill="url(#circleGrad2)" fill-opacity="0.85"/>

  <!-- Shared Center Equilibrium Symbol -->
  <circle cx="256" cy="256" r="40" fill="#ffffff" fill-opacity="0.95"/>
  <path d="M 238 256 L 274 256 M 256 238 L 256 274" stroke="#1e1b4b" stroke-width="8" stroke-linecap="round"/>
</svg>
